<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <script>
      // 老 Kindle（Paperwhite 3 一类，固件 5.16.2 / AppleWebKit 534）跑不动 Vue 运行时
      // —— 缺 Proxy / Promise / Map / Set，SPA 在它上面只会白屏，而且这类设备没有
      // devtools，白屏无从排查。所以在任何 module 脚本之前先嗅探一次，把它引到
      // 后端直出的 /lite（内容写在 HTML 里，不依赖脚本）。
      //
      // 这段脚本自己必须是 ES5：老引擎在解析阶段就拒绝 let / const / 箭头函数 /
      // 模板字符串，写了一个，整段脚本不执行，跳转随之失效、依旧是白屏。
      (function () {
        // 已经在 /lite 下
        if (/^\/lite(\/|$)/.test(location.pathname)) return;
        // 点过「切换到完整版」的设备会看到一个浮在底部的「切回简版」口，
        // 由 <body> 末尾那个原生 <a> 渲染
        if (/coblog-lite-optout/.test(document.cookie)) {
          document.documentElement.className += ' lite-opted-out';
        }
        // 「切回精简版」链接会带上它：清掉记忆并回 /lite。
        // 这个分支放在 UA 判断之前 —— 它是显式指令，与设备无关。
        if (/[?&]lite=1(&|$)/.test(location.search)) {
          document.cookie = 'coblog-lite-optout=; path=/; max-age=0';
          location.replace('/lite' + location.pathname);
          return;
        }

        var ua = navigator.userAgent;

        // 有 Chrome/xx 说明是新一代内核（固件 ≥5.16.4），放过。
        if (/Chrome\//.test(ua)) return;

        // 老 Kindle：只有 AppleWebKit/5xx 标记、没有 Chrome。
        if (!/AppleWebKit\/5\d\d/.test(ua)) return;

        // 用户主动选过「完整版」，暂时不再自动跳转。
        if (/coblog-lite-optout/.test(document.cookie)) return;

        // /lite 页脚给了这个入口，点一次就记住
        if (/[?&]full=1(&|$)/.test(location.search)) {
          document.cookie = 'coblog-lite-optout=1; path=/; max-age=21600';
          return;
        }

        location.replace('/lite' + location.pathname + location.search);
      })();
    </script>
    <link rel="icon" href="/src/assets/icon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coco の 避风港</title>
    <style>
      /*
        「切回简版」
      */
      .lite-back {
        display: none;
      }

      /* 全宽通栏、54px 高、白字深底。*/
      .lite-opted-out .lite-back {
        display: block;
        position: fixed;
        left: 0;
        right: 0;
        top: 0;
        z-index: 2147483647;

        min-height: 76px;
        -webkit-box-sizing: border-box;
        box-sizing: border-box;
        padding: 12px 18px;
        overflow: hidden;

        background: #0f5f63;
        color: #ffffff;
        font-size: 19px;
        font-weight: bold;
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        text-align: center;
        text-decoration: none;
      }
      
      .lite-opted-out .lite-back-tip {
        display: block;
        margin-top: 4px;
        font-size: 14px;
        font-weight: normal;
        line-height: 1.5;
        color: #c6e6e6;
      }

      /* 导航栏是 position:sticky; top:0，不推开就会被通栏盖住。
         组件里的 scoped 选择器带 data-v 属性，优先级与本条相当，所以必须 !important */
      .lite-opted-out .navbar {
        top: 76px !important;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
    <!-- 这个链接在 #app 之外 —— 即使 Vue 报错白屏，它依然在页面上。-->
    <a class="lite-back" href="?lite=1">
      无法正常查看？ 切回精简版 →
      <span class="lite-back-tip">页面显示不正常时可手动切换；此处 8 秒后仍未渲染完成会自动跳转</span>
    </a>
    <!--
      渲染失败就自己回去
    -->
    <script>
      (function () {
        if (/^\/lite(\/|$)/.test(location.pathname)) return;
        if (!/coblog-lite-optout/.test(document.cookie)) return;

        setTimeout(function () {
          var app = document.getElementById('app');
          if (app && app.children.length > 0) return;
          location.replace('/lite' + location.pathname);
        }, 8000);
      })();
    </script>

    <!--
      把导航栏推到通栏下面。

      ⚠️ 不能像原来那样在 CSS 里把 .navbar 的 top 写死：通栏高度会随文案换行变化。CSS 里没
      「让 fixed 元素的高度驱动 sticky 元素的 top」这种机制，只能量。
      用 setProperty 带 important，压过 CSS 里那条兜底规则。
    -->
    <script>
      (function () {
        if (!/coblog-lite-optout/.test(document.cookie)) return;

        function sync() {
          var bar = document.querySelector('.lite-back');
          var nav = document.querySelector('.navbar');
          if (!bar || !nav) return;
          var bottom = Math.round(bar.getBoundingClientRect().bottom);
          if (nav.style.top === bottom + 'px') return;
          nav.style.setProperty('top', bottom + 'px', 'important');
        }

        // 等 Vue 把导航栏挂上来。
        var tries = 0;
        var timer = setInterval(function () {
          sync();
          if (++tries > 120) clearInterval(timer);
        }, 500);

        // 窗口尺寸变化会改变通栏的折行数，进而改变它的高度。
        window.addEventListener('resize', sync);
      })();
    </script>
  </body>
</html>
